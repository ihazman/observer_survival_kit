<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AWS Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap');

:root {
  --bg:      #eef0f4;
  --surface: #ffffff;
  --border:  #c8cdd6;
  --border2: #aab2bf;
  --text:    #1a1e26;
  --sub:     #5a6370;
  --accent:  #003366;
  --accent2: #002244;
  --green:   #267a26;
  --vbg:     #f7f9fb;
  --mono:    'Verdana', 'Nunito', 'Segoe UI', sans-serif;
  --sans:    'Verdana', 'Nunito', 'Segoe UI', sans-serif;
  --r:       5px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

button, input, select, label {
  touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(0,0,0,0.08);
  font-family: var(--sans);
}
input, select, textarea { font-family: var(--sans); }
button { cursor: pointer; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  min-height: 100dvh;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  padding: 10px 10px 4px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Card */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }

/* Title bar */
.titlebar {
  background: var(--accent); color: #fff;
  padding: 7px 12px;
  font-family: var(--sans); font-size: .87rem; font-weight: 700; letter-spacing: .04em;
  display: flex; align-items: center; gap: 7px;
}
.t-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #ffffff; flex-shrink: 0;
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

/* Station row */
.row-top { display:flex; align-items:center; gap:7px; padding:8px 10px; }
.sel-wrap { flex:1; position:relative; }
#stationSel {
  width:100%; background:var(--vbg); border:1px solid var(--border2); border-radius:var(--r);
  color:var(--text); padding:0 26px 0 8px; height:36px;
  font-family:var(--sans); font-size:.82rem; font-weight:500;
  appearance:none; -webkit-appearance:none; cursor:pointer;
}
#stationSel:focus { outline:none; border-color:var(--accent); }
.sel-wrap::after { content:'▾'; position:absolute; right:8px; top:50%; transform:translateY(-50%); color:var(--sub); pointer-events:none; font-size:.75rem; }

#btnFetch.spinning svg { animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Date + auto row */
.row-sub {
  display:flex; align-items:center; justify-content:space-between;
  padding:5px 10px 8px; border-top:1px solid var(--border); gap:8px;
}
.date-str { font-family:var(--mono); font-size:.82rem; color:var(--sub); }
.auto-lbl { display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:.72rem; color:var(--sub); cursor:pointer; white-space:nowrap; }
.auto-lbl input[type=checkbox] { accent-color:var(--accent); width:14px; height:14px; cursor:pointer; }

/* Status box */
.status-box {
  background:var(--vbg); border:1px solid var(--border); border-radius:var(--r);
  padding:7px 10px; font-family:var(--mono); font-size:.74rem;
  color:var(--sub); line-height:1.7; min-height:32px;
}

/* Readings grid */
.rgrid { display:grid; gap:0; }
.rgrid.r4 { grid-template-columns:1fr 1fr 1fr 1fr; }
.rgrid.r3 { grid-template-columns:1fr 1fr 2fr; border-top:1px solid var(--border); }
.rgrid.r3l { grid-template-columns:2fr 1fr 1fr; border-top:1px solid var(--border); }
.cell { padding:8px 9px 10px; border-right:1px solid var(--border); }
.cell:last-child { border-right:none; }
.cell-lbl { font-size:.7rem; color:var(--sub); font-weight:500; margin-bottom:4px; white-space:nowrap; line-height:1.2; }
.cell-lbl .ctag { font-size:.6rem; color:#999; font-style:italic; }
.val-box { background:var(--vbg); border:1.5px solid var(--border2); border-radius:3px; padding:3px 7px; min-height:32px; display:flex; align-items:center; }
.val-box.hi { border-color:var(--accent); background:#e8eef4; }
.val-box.calc-box { border-style:dashed; background:#f4f6fa; }
.val { font-family:var(--mono); font-size:1.2rem; color:var(--text); letter-spacing:.02em; line-height:1; }
.val.bold { font-weight:700; }
.val.ld { color:#bbb; font-size:1rem; animation:pulse 1s ease-in-out infinite; }
.val.na { color:#ccc; font-size:.9rem; }

/* METAR / QNH shared header */
.panel-header {
  color:#fff; padding:6px 12px;
  font-family:var(--sans); font-size:.82rem; font-weight:700; letter-spacing:.04em;
  display:flex; align-items:center; justify-content:space-between;
  min-height:38px;
}
.panel-badge { font-family:var(--mono); font-size:.8rem; background:rgba(255,255,255,.18); padding:1px 7px; border-radius:3px; letter-spacing:.1em; }

/* METAR */
#metarBox { padding:6px 0 4px; }
.metar-row { padding:6px 11px 7px; border-bottom:1px solid var(--border); font-family:var(--mono); font-size:.85rem; color:var(--text); line-height:1.55; overflow-wrap: break-word; word-break: break-word; }
.metar-row:last-child { border-bottom:none; }
.metar-type { display:inline-block; font-size:.6rem; font-weight:700; letter-spacing:.08em; padding:1px 5px; border-radius:3px; margin-right:4px; vertical-align:middle; background:var(--accent); color:#fff; }
.metar-type.speci { background:#b35c00; }
.metar-placeholder { color:var(--sub); font-style:italic; font-size:.74rem; }
.metar-nodata { color:var(--sub); font-style:italic; }
.metar-badge {
  display:inline-block; font-size:.65rem; font-weight:700;
  letter-spacing:.08em; padding:2px 6px; border-radius:3px;
  margin-right:5px; vertical-align:middle; color:#fff;
  font-family:var(--sans);
}
.metar-badge-type { background:#888; }
.speci-badge      { background:#c0392b; }
.metar-receipt {
  font-size: .65rem;
  color: var(--sub);
  font-family: var(--sans);
  margin-top: 4px;
  text-align: right;
}

/* QNH panel */
.qnh-body { padding:10px 10px 12px; display:flex; flex-direction:column; gap:8px; }
.qnh-row  { display:flex; align-items:flex-end; gap:8px; flex-wrap:wrap; }
.qnh-field { display:flex; flex-direction:column; gap:3px; flex:1; min-width:80px; }
.qnh-lbl { font-size:.7rem; color:var(--sub); font-weight:500; white-space:nowrap; font-family:var(--sans); }
.qnh-input {
  background:var(--vbg); border:1.5px solid var(--border2); border-radius:3px;
  padding:3px 7px; font-family:var(--mono); font-size:.95rem; color:var(--text);
  width:100%; min-height:30px;
}
.qnh-input:focus { outline:none; border-color:var(--accent); }
.qnh-input.error { border-color:#c0392b; background:#fff5f5; }
.qnh-err { display:none; font-size:.65rem; color:#c0392b; font-family:var(--sans); margin-top:2px; line-height:1.3; }
.qnh-err.show { display:block; }
.qnh-input[readonly] { background:#f0f0f0; border-color:#000; color:#000; font-weight:600; cursor:not-allowed; }
.qnh-result-box { border-color:#000; background:#f0f0f0; font-size:1.42rem; font-weight:700; color:#000; display:flex; align-items:center; cursor:default; user-select:text; }
.qnh-btn {
  background:var(--surface); border:1.5px solid #000; border-radius:3px; color:#000;
  padding:6px 14px; font-family:var(--sans); font-size:.88rem; font-weight:700; letter-spacing:.04em;
  white-space:nowrap; min-height:36px; align-self:flex-end; transition:background .15s, color .15s;
}
.qnh-btn:active { background:#000; color:#fff; }
.qnh-btn-clear { border-color:#000; color:#000; }
.qnh-btn-clear.dimmed { border-color:var(--border2); color:var(--sub); }
.qnh-btn-clear.dimmed:active { background:var(--border2); color:#fff; }
.qnh-chk-wrap {
  display:inline-flex; align-items:center; gap:3px;
  font-size:.62rem; color:var(--accent); cursor:pointer;
  font-family:var(--sans); font-weight:700;
  border:1px solid var(--accent); border-radius:3px; padding:1px 5px; line-height:1.4; white-space:nowrap;
}
.qnh-chk-wrap input[type=checkbox] { accent-color:var(--accent); width:11px; height:11px; cursor:pointer; }

/* Keep Screen Awake bar */
.awake-bar {
  max-width: 480px;
  margin: 0 auto;
  padding: 6px 14px 2px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.awake-lbl {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--sans);
  font-size: .72rem;
  color: var(--sub);
  cursor: pointer;
}
.awake-lbl input[type=checkbox] {
  accent-color: var(--accent);
  width: 13px; height: 13px;
  cursor: pointer;
}
.awake-status {
  font-family: var(--sans);
  font-size: .72rem;
  padding: 0;
  display: none;
}
.awake-status.on  { display:inline; color:var(--accent); font-weight:700; }
.awake-status.off { display:inline; color:var(--sub); }
.awake-status.no  { display:inline; color:#b35c00; }

/* Quick Notes */
.notes-body { padding: 6px 10px 8px; }
.notes-ta {
  width: 100%;
  min-height: 32px;
  max-height: 300px;
  overflow-y: auto;
  border: 1.5px solid var(--border2);
  border-radius: 3px;
  padding: 5px 8px;
  font-family: var(--sans);
  font-size: 1.05rem;
  color: #000;
  background: var(--vbg);
  line-height: 1.5;
  box-sizing: border-box;
  transition: border-color .15s;
  display: block;
  -webkit-user-select: text;
  user-select: text;
  word-break: break-word;
  white-space: pre-wrap;
  outline: none;
}
.notes-ta:focus { border-color: #006666; }
.notes-ta[contenteditable="false"] { background: #f4f6fa; color: #555; cursor: not-allowed; }
.notes-ta:empty::before {
  content: attr(data-placeholder);
  color: #aaa;
  pointer-events: none;
}
.metar-placeholder-tag {
  background: rgba(242, 255, 0, 1);
  color: #000;
  border-radius: 2px;
  padding: 0 1px;
  font-style: normal;
}
.notes-btn {
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 4px;
  color: #fff;
  padding: 3px 9px;
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  min-height: 26px;
  font-family: var(--sans); font-size: .72rem; font-weight: 600;
  transition: background .15s;
  white-space: nowrap;
}
.notes-btn:active { background: rgba(255,255,255,.35); }
.notes-btn:disabled { opacity: .35; cursor: not-allowed; pointer-events: none; }
.notes-btn.dimmed { opacity: .4; }

/* Stale data icon */
.stale-icon {
  display: inline-flex; align-items: center; gap: 4px;
  margin-left: 8px; color: #c0392b;
  font-size: .72rem; font-weight: 700;
  animation: staleBlink 1s ease-in-out infinite;
  vertical-align: middle;
}
@keyframes staleBlink { 0%,100%{opacity:1} 50%{opacity:.15} }

.footnote { text-align:center; padding:10px 0 18px; font-family:var(--sans); font-size:.8rem; color:#aaa; letter-spacing:.02em; }
</style>

<body>
<div class="app">

  <!-- HEADER -->
  <div class="card">
    <div class="titlebar">
      <div class="t-dot"></div>
      <span style="flex:1;">AWS Dashboard</span>
      <div style="color:#fff;font-family:var(--mono);font-size:.65rem;white-space:nowrap;">Cycle(s): <span id="cyc" style="font-weight:700;">0</span></div>
      <button id="btnFetch" class="notes-btn" onclick="fetchAll()" style="margin-left:8px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Fetch</span>
      </button>
    </div>
    <div class="row-sub">
      <div class="sel-wrap" style="flex:1;max-width:55%;">
        <select id="stationSel" onchange="onStation()"></select>
      </div>
      <span class="date-str" id="dstr">—</span>
      <label class="auto-lbl">
        <input type="checkbox" id="autoChk" checked onchange="toggleAuto()">
        <span id="autoTxt">Fetch in —s</span>
      </label>
    </div>
  </div>

  <!-- STATUS -->
  <div class="status-box" id="sbox">Waiting for data...<span id="staleIcon" style="display:none;"></span></div>

  <!-- READINGS -->
  <div class="card">
    <div class="rgrid r4">
      <div class="cell">
        <div class="cell-lbl">Wind Direction</div>
        <div class="val-box"><div class="val ld bold" id="v-wdir">···</div></div>
      </div>
      <div class="cell">
        <div class="cell-lbl">Wind Speed</div>
        <div class="val-box"><div class="val ld bold" id="v-wspd">···</div></div>
      </div>
      <div class="cell">
        <div class="cell-lbl">Dry Bulb</div>
        <div class="val-box"><div class="val ld bold" id="v-temp">···</div></div>
      </div>
      <div class="cell">
        <div class="cell-lbl">RH</div>
        <div class="val-box"><div class="val ld" id="v-rh">···</div></div>
      </div>
    </div>
    <div class="rgrid r3l">
      <div class="cell">
        <div class="cell-lbl">Rainfall <span class="ctag">(5-min)</span></div>
        <div class="val-box" id="wrap-rain"><div class="val na" id="v-rain">—</div></div>
        <button id="btnMute" onclick="toggleMute()" style="display:none;">🔊</button>
      </div>
      <div class="cell">
        <div class="cell-lbl">Wet Bulb <span class="ctag">(Calc)</span></div>
        <div class="val-box calc-box"><div class="val na" id="v-wb">—</div></div>
      </div>
      <div class="cell">
        <div class="cell-lbl">Dew Point <span class="ctag">(Calc)</span></div>
        <div class="val-box calc-box"><div class="val na bold" id="v-dp">—</div></div>
      </div>
    </div>
  </div>

  <!-- QNH -->
  <div class="card">
    <div class="panel-header" style="background:#000;">
      <span>QNH Calculation</span>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="notes-btn qnh-btn-clear dimmed" id="btnClear" onclick="clearQNH()" title="Clear fields">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          <span>Clear</span>
        </button>
        <button class="notes-btn" id="btnCalculate" onclick="calculateQNH()" title="Calculate QNH">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/><line x1="8" y1="18" x2="10" y2="18"/></svg>
          <span>Calculate</span>
        </button>
      </div>
    </div>
    <div class="qnh-body">
      <div class="qnh-row">
        <div class="qnh-field">
          <label class="qnh-lbl" for="qnh-att">Att Thermo</label>
          <input class="qnh-input" id="qnh-att" type="text" inputmode="decimal" placeholder="e.g. 25.0" autocomplete="off" onblur="validateAtt(this)" oninput="updClearBtn()" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('qnh-baro').focus();}">
          <span class="qnh-err" id="att-err"></span>
        </div>
        <div class="qnh-field">
          <label class="qnh-lbl" for="qnh-baro">As Read</label>
          <input class="qnh-input" id="qnh-baro" type="text" inputmode="decimal" placeholder="e.g. 1012.0" autocomplete="off" onblur="validateBaro(this)" oninput="updClearBtn()" onkeydown="if(event.key==='Enter'){event.preventDefault();validateBaro(this);calculateQNH();}">
          <span class="qnh-err" id="baro-err"></span>
        </div>
        <div class="qnh-field">
          <label class="qnh-lbl" for="qnh-db" style="display:flex;align-items:center;justify-content:space-between;">
            <span>Dry Bulb</span>
            <label class="qnh-chk-wrap">
              <input type="checkbox" id="chkUseDryBulb" checked onchange="toggleDryBulbLock()">
              <span>Use AWS</span>
            </label>
          </label>
          <input class="qnh-input" id="qnh-db" type="text" inputmode="decimal" placeholder="e.g. 30.0" autocomplete="off" readonly>
        </div>
      </div>
      <div class="qnh-row">
        <div class="qnh-field">
          <label class="qnh-lbl" for="qnh-result">QNH</label>
          <div class="qnh-input qnh-result-box" id="qnh-result" title="">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- QUICK NOTES -->
  <div class="card">
    <div class="panel-header" style="background:#006666;">
      <span>Quick Notes</span>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="notes-btn" id="btnMetarTpl" onclick="insertMetarTemplate()" title="Insert METAR template">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>METAR</span>
        </button>
        <button class="notes-btn" id="btnSpeciTpl" onclick="insertSpeciTemplate()" title="Insert SPECI template">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>SPECI</span>
        </button>
        <button class="notes-btn" id="btnNotesLock" onclick="toggleNotesLock()" disabled title="Lock notes">
          <svg id="lockIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span id="lockCaption">Lock</span>
        </button>
        <button class="notes-btn" id="btnNotesClear" onclick="clearNotes()" title="Clear notes">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          <span>Clear</span>
        </button>
      </div>
    </div>
    <div class="notes-body">
      <div id="notesArea" class="notes-ta" contenteditable="true"
        data-placeholder="Tap to add notes..."
        oninput="onNotesInput()" onblur="onNotesBlur()"
        style="-webkit-user-select:text;user-select:text;"></div>
    </div>
  </div>

  <!-- METAR -->
  <div class="card">
    <div class="panel-header" style="background:#444;">
      <span>Latest 3 observation reports</span>
    </div>
    <div id="metarBox">
      <div class="metar-row metar-placeholder">Waiting for data...</div>
    </div>
  </div>

</div>

<!-- SCREEN AWAKE -->
<div class="awake-bar">
  <label class="awake-lbl" id="awakeLbl">
    <input type="checkbox" id="chkAwake" checked onchange="toggleAwake()">
    <span>Keep Screen Awake</span>
    <span class="awake-status" id="awakeStatus"></span>
  </label>
</div>

  }, { once: true });
});

function startCD() {
  stopCD();
  if (!document.getElementById('autoChk').checked) return;
  cdSec = CD_INT; updCD();
  cdTimer = setInterval(function() {
    cdSec--; updCD();
    if (cdSec <= 0) { fetchAll(); cdSec = CD_INT; }
  }, 1000);
}
function stopCD() { if (cdTimer) { clearInterval(cdTimer); cdTimer = null; } }
function toggleAuto() {
  if (document.getElementById('autoChk').checked) startCD();
  else { stopCD(); document.getElementById('autoTxt').textContent = 'Auto Fetch off'; }

// ── FETCH ─────────────────────────────────────────────────────────
function fetchAll() {
  setLD();
  var btn = document.getElementById('btnFetch');
  btn.classList.add('spinning');

  var promises = Object.keys(EP).map(function(k) {
    return fetch(EP[k])
      .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j) { cache[k] = j; })
      .catch(function(e) { console.warn(k + ':', e.message); });
  });

  Promise.all(promises).then(function() {
    cycleN++;
    document.getElementById('cyc').textContent = cycleN;
    merge();
    renderAll();
    btn.classList.remove('spinning');
    if (document.getElementById('autoChk').checked) startCD();
  });

  fetchMetar();
}

// ── MERGE ─────────────────────────────────────────────────────────
// v2 API shape: { data: { readings: [{ timestamp, data: [{ stationId, value }] }] } }
function merge() {
  allStn = {};
  Object.keys(cache).forEach(function(k) {
    var d = cache[k];
    if (!d || !d.data || !d.data.readings || !d.data.readings.length) return;
    var latest = d.data.readings[d.data.readings.length - 1];
    if (!latest || !latest.data) return;
    latest.data.forEach(function(r) {
      var id = r.stationId;
      if (!allStn[id]) allStn[id] = {};
      allStn[id][k] = r.value;
      allStn[id][k + '_ts'] = latest.timestamp;
    });
  });
}

// ── RENDER ────────────────────────────────────────────────────────
function renderAll() {
  var st = allStn[selStn] || {};
  var T  = st.temperature;
  var RH = st.humidity;
  var WD = st.windDir;
  var WS = st.windSpeed;
  var RF = st.rainfall;

  sv('v-temp', T  !== undefined ? T.toFixed(1) : null);
  sv('v-rh',   RH !== undefined ? Math.round(RH).toString() : null);
  sv('v-wdir', WD !== undefined ? (Math.round(WD/10)*10).toString().padStart(3,'0') : null);
  sv('v-wspd', WS !== undefined ? Math.round(WS).toString().padStart(2,'0') : null);
  sv('v-rain', RF !== undefined ? RF.toFixed(1) : null);

  if (RF !== undefined) announceRain(RF, st.rainfall_ts);

  if (T !== undefined && RH !== undefined) {
    sv('v-wb', calcWB(T, RH).toFixed(1));
    sv('v-dp', calcDP(T, RH).toFixed(1));
  } else {
    sv('v-wb', null); sv('v-dp', null);
  }

  // Sync dry bulb to QNH if checkbox ticked
  var chk = document.getElementById('chkUseDryBulb');
  if (chk && chk.checked && T !== undefined) {
    document.getElementById('qnh-db').value = T.toFixed(1);
  }

  updStatus(st.temperature_ts || st.humidity_ts || st.windDir_ts);
}

var BOLD_IDS = { 'v-temp':true, 'v-wdir':true, 'v-wspd':true, 'v-dp':true };

function sv(id, val) {

function updStatus(ts) {
  var timeStr = '—';
  var isStale = false;
  if (ts) {
    var d = new Date(ts);
    var now = new Date();
    var ageMin = (now - d) / 60000;
    isStale = ageMin > 10;
    var lt = d.toLocaleTimeString('en-SG', { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Asia/Singapore' });
    var utcH = String(d.getUTCHours()).padStart(2,'0');
    var utcM = String(d.getUTCMinutes()).padStart(2,'0');
    timeStr = '<b style="color:#003366;font-size:.95rem;">' + lt + ' LT</b> | <b style="color:#b35c00;font-size:.95rem;">' + utcH + ':' + utcM + ' Z</b>';
  }
  var staleHtml = isStale
    ? '&nbsp;<span class="stale-icon">'
      + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>'
      + '<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>'
      + '<line x1="2" y1="2" x2="22" y2="22"/>'
      + '</svg> No new data</span>'
    : '';
  document.getElementById('sbox').innerHTML =
    'Data Timestamp: ' + timeStr + staleHtml;

  // Colour all readout values red if stale, black if fresh
  var staleColour = isStale ? '#c0392b' : '';
  ['v-wdir','v-wspd','v-temp','v-rh','v-rain','v-wb','v-dp'].forEach(function(id) {
    var e = document.getElementById(id);
    if (e) e.style.color = staleColour;
  });

  // Sync QNH Dry Bulb colour if Use AWS is checked
  var chkAWS = document.getElementById('chkUseDryBulb');
  if (chkAWS && chkAWS.checked) {
    var dbEl = document.getElementById('qnh-db');
    if (dbEl) dbEl.style.color = isStale ? '#c0392b' : '#000';
  }
}

// ── CALCULATED VALUES ─────────────────────────────────────────────
function calcWB(T, RH) {
  return T * Math.atan(0.151977 * Math.pow(RH + 8.313659, 0.5))
       + Math.atan(T + RH)
       - Math.atan(RH - 1.676331)
       + 0.00391838 * Math.pow(RH, 1.5) * Math.atan(0.023101 * RH)
       - 4.686035;
}
function calcDP(T, RH) {
  var a = 17.625, b = 243.04;
  var al = (a * T) / (b + T) + Math.log(RH / 100);
  return (b * al) / (a - al);
}

// ── RAINFALL SPEECH ───────────────────────────────────────────────
function announceRain(rf, ts) {
  if (speechMuted || !window.speechSynthesis) return;
  if (rf <= 0) { lastRainTs = ts; return; }
  if (ts && ts === lastRainTs) return;
  lastRainTs = ts;
  var utt = new SpeechSynthesisUtterance(rf.toFixed(1) + ' m m, of rainfall detected.');
  utt.lang = 'en-SG'; utt.rate = 0.92;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utt);
  var box = document.getElementById('wrap-rain');
  if (box) {
    box.style.borderColor = '#003366'; box.style.background = '#e8eef4';
    setTimeout(function() { box.style.borderColor = ''; box.style.background = ''; }, 2500);
  }
}

  speechMuted = !speechMuted;
  var btn = document.getElementById('btnMute');

}

var QNH_CISTERN_HT       = 35.0;
var QNH_LATITUDE         = 1.35;
var QNH_INDEX_CORRECTION = -0.2;

function calculateQNH() {
  // Block if any field is in error state
  if (document.getElementById('qnh-att').classList.contains('error')) {
    document.getElementById('qnh-result').textContent = 'Check Att Thermo';
    return;
  }
  if (document.getElementById('qnh-baro').classList.contains('error')) {
    document.getElementById('qnh-result').textContent = 'Check As Read';
    return;
  }
  var baro    = parseFloat(document.getElementById('qnh-baro').value);
  var dryBulb = parseFloat(document.getElementById('qnh-db').value);
  var attT    = parseFloat(document.getElementById('qnh-att').value);
  var res     = document.getElementById('qnh-result');
  if (isNaN(baro) || isNaN(dryBulb) || isNaN(attT)) { res.textContent = 'Input error'; return; }
  var altC      = 0.0003086 * QNH_CISTERN_HT;
  var tempC     = ((0.000163 * baro) / (1 + 0.0001818 * attT) + 0.008) * attT;
  var pi        = Math.PI;
  var lat1      = 2 * QNH_LATITUDE / 180 * pi;
  var G1        = 980.616 * (1 - 0.0026373 * Math.cos(lat1) + 0.0000059 * Math.cos(lat1) * Math.cos(lat1));
  var latC      = baro * (G1 / 980.665 - 1);
  var totC      = QNH_INDEX_CORRECTION + altC - tempC + latC;
  var corrC     = baro + totC;
  var corrQNH   = corrC * Math.pow(1 + 0.0065 * QNH_CISTERN_HT / (273.16 + dryBulb), 5.2568) - corrC;
  var qnh = corrC + corrQNH;
  var qCode = 'Q' + String(Math.floor(qnh)).padStart(4, '0');
  res.innerHTML = qCode + '&nbsp;&nbsp;<span style="color:#666;font-size:1.42rem;font-weight:400;">(' + qnh.toFixed(1) + ')</span>';
  res.title = 'Note: QNH Pressure value is always rounded down for METAR/SPECI reports.';

  // If notesArea is not locked and contains <QNH>, replace it with the coded Q value
  if (!notesLocked) {
    var notesEl = document.getElementById('notesArea');
    if (notesEl && notesEl.innerHTML.indexOf('&lt;QNH&gt;') !== -1) {
      notesEl.innerHTML = notesEl.innerHTML.replace(
        /(<span[^>]*metar-placeholder-tag[^>]*>)?&lt;QNH&gt;(<\/span>)?/g,
        qCode
      );
    }
  }
}

var TGFTP_URL = 'https://tgftp.nws.noaa.gov/data/observations/metar/stations/WSAP.TXT';
var AWC_URL   = 'https://aviationweather.gov/api/data/metar?ids=WSAP&format=json&hours=6';
var PROXIES   = [
  function(u) { return 'https://corsproxy.io/?' + encodeURIComponent(u); },       // Source 2 — priority
  function(u) { return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u); }, // Source 3
  function(u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },      // Source 4
  function(u) { return 'https://api.cors.lol/?url=' + encodeURIComponent(u); },              // Source 1 (tgftp fallback)
];

function fetchWithTimeout(url, ms) {
  return new Promise(function(resolve, reject) {
    var timer = setTimeout(function() { reject(new Error('timeout')); }, ms);
    fetch(url)
      .then(function(r) { clearTimeout(timer); resolve(r); })
      .catch(function(e) { clearTimeout(timer); reject(e); });
  });
}

function fetchMetar() {
  var box = document.getElementById('metarBox');
  box.innerHTML = '<div class="metar-row metar-placeholder">Fetching reports...</div>';
  var debugLines = [];
  // Try AWC via proxies first (gives up to 3 reports), then fall back to tgftp (1 report)
  tryAWC(box, debugLines);
}

function tryAWC(box, debugLines) {
  var idx = 0;
  function next() {
    if (idx >= PROXIES.length) {
      // All AWC proxies failed — try tgftp as last resort
      tryTGFTP(box, debugLines);
      return;
    }
    var makeUrl = PROXIES[idx++];
    fetchWithTimeout(makeUrl(AWC_URL), 20000)
      .then(function(r) {
        if (!r.ok) { debugLines.push('proxy' + idx + ':' + r.status); return next(); }
        return r.text().then(function(txt) {
          var json;
          try { json = JSON.parse(txt); } catch(e) { debugLines.push('proxy' + idx + ':parse'); return next(); }
          if (json && typeof json.contents === 'string') {
            try { json = JSON.parse(json.contents); } catch(e) { return next(); }
          }
          if (Array.isArray(json) && json.length > 0 && json[0].icaoId) {
            var reports = json.sort(function(a,b){return b.obsTime-a.obsTime;}).slice(0,3);
            var raws = reports.map(function(r){ return { raw: r.rawOb||'', receipt: r.receiptTime||null }; });
            renderMetarRows(box, raws);
          } else {
            debugLines.push('proxy' + idx + ':badshape');
            return next();
          }
        });
      })
      .catch(function(e) { debugLines.push('proxy' + idx + ':' + e.message.slice(0,12)); next(); });
  }
  next();
}

function tryTGFTP(box, debugLines) {
  var tgftpProxy = 'https://api.cors.lol/?url=' + encodeURIComponent(TGFTP_URL);
  fetchWithTimeout(tgftpProxy, 20000)
    .then(function(r) {
      if (!r.ok) { debugLines.push('tgftp:' + r.status); showNoData(box, debugLines); return; }
      return r.text().then(function(txt) {
        var lines = txt.trim().split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
        var raw = lines.find(function(l) { return l.includes('WSAP'); }) || null;
        if (raw) {
          renderMetarRows(box, [{ raw: raw, receipt: null }]);
        } else {
          debugLines.push('tgftp:nomatch');
          showNoData(box, debugLines);
        }
      });
    })
    .catch(function(e) {
      debugLines.push('tgftp:' + e.message.slice(0,15));
      showNoData(box, debugLines);
    });
}

function showNoData(box, debugLines) {
  box.innerHTML = '<div class="metar-row metar-nodata">No Data</div>';
  showDebug(box, debugLines);
}

function renderMetarRows(box, raws) {
  box.innerHTML = raws.filter(function(r){ return r && r.raw; }).map(function(item) {
    var raw = item.raw;
    var isSpeci = raw.startsWith('SPECI');
    var isMETAR = raw.startsWith('METAR');
    var badge = '';
    var rest = raw;
    if (isSpeci) {
      badge = '<span class="metar-badge speci-badge">SPECI</span>';
      rest = raw.slice(5).trim();
    } else if (isMETAR) {
      badge = '<span class="metar-badge metar-badge-type">METAR</span>';
      rest = raw.slice(5).trim();
    }
    var receiptHtml = '';
    if (item.receipt) {
      var d = new Date(item.receipt);
      var utc = d.getUTCHours().toString().padStart(2,'0') + ':' + d.getUTCMinutes().toString().padStart(2,'0') + ' Z';
      var lt  = d.toLocaleTimeString('en-SG', { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Asia/Singapore' }) + ' LT';
      receiptHtml = '<div class="metar-receipt">Received: ' + lt + ' | ' + utc + '</div>';
    }
    return '<div class="metar-row">' + badge + escHtml(rest) + receiptHtml + '</div>';
  }).join('');
}

function showDebug(box, lines) {
  var d = document.createElement('div');
  d.style.cssText = 'padding:4px 11px;font-size:.6rem;color:#aaa;font-family:monospace;border-top:1px solid #eee;word-break:break-all;';
  d.textContent = lines.join(' | ');
  box.appendChild(d);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── AUTO UPPERCASE FOR METAR/SPECI LINES ─────────────────────────
var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

function getCaretOffset(el) {
  var sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return 0;
  var range = sel.getRangeAt(0).cloneRange();
  range.selectNodeContents(el);
  range.setEnd(sel.getRangeAt(0).endContainer, sel.getRangeAt(0).endOffset);
  return range.toString().length;
}

function setCaretOffset(el, offset) {
  var sel = window.getSelection();
  if (!sel) return;
  var nodeStack = [el], node, found = false, charCount = 0;
  while (!found && (node = nodeStack.pop())) {
    if (node.nodeType === 3) {
      var nextCount = charCount + node.length;
      if (nextCount >= offset) {
        var range = document.createRange();
        range.setStart(node, offset - charCount);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
        found = true;
      }
      charCount = nextCount;
    } else {
      var i = node.childNodes.length;
      while (i--) nodeStack.push(node.childNodes[i]);
    }
  }
}

function applyMetarUppercase(el) {
  var caretPos = getCaretOffset(el);
  var lines = el.innerHTML.split(/<br\s*\/?>/i);
  var changed = false;
  var newLines = lines.map(function(line) {
    var plain = line.replace(/<[^>]+>/g, '');
    if (/^(METAR|SPECI)/i.test(plain.trim())) {
      var eqIdx = plain.indexOf('=');
      // Only uppercase text strictly BEFORE the = (not including = or after)
      var limit = eqIdx !== -1 ? eqIdx : plain.length;
      var tempDiv = document.createElement('div');
      tempDiv.innerHTML = line;
      var textSeen = 0;
      var walk = function(node) {
        if (node.nodeType === 3) {
          var nodeLen = node.length;
          if (textSeen < limit) {
            var take = Math.min(nodeLen, limit - textSeen);
            var before = node.textContent.slice(0, take);
            var upper  = before.toUpperCase();
            if (upper !== before) {
              node.textContent = upper + node.textContent.slice(take);
              changed = true;
            }
          }
          textSeen += nodeLen;
        } else {
          Array.from(node.childNodes).forEach(walk);
        }
      };
      Array.from(tempDiv.childNodes).forEach(walk);
      return tempDiv.innerHTML;
    }
    return line;
  });
  if (changed) {
    el.innerHTML = newLines.join('<br>');
    setCaretOffset(el, caretPos);
  }
}

function onNotesInput() {
  var el = document.getElementById('notesArea');
  applyMetarUppercase(el);
  updNotesButtons();
}

function onNotesBlur() {
  var el = document.getElementById('notesArea');
  if (!el) return;

  // Apply uppercase to METAR/SPECI lines on blur as final pass
  applyMetarUppercase(el);

  // Collapse multiple spaces and remove space before =
  var html = el.innerHTML;
  html = html.replace(/( |&nbsp;){2,}/g, ' ');
  html = html.replace(/ =/g, '=');
  el.innerHTML = html;

  // Review yellow highlights — remove span wrapper if text no longer matches <...> pattern
  // Do this AFTER innerHTML reassignment to avoid re-insertion
  var spans = el.querySelectorAll('.metar-placeholder-tag');
  spans.forEach(function(span) {
    var txt = (span.textContent || span.innerText || '').trim();
    if (!/^<[^>]+>$/.test(txt)) {
      var parent = span.parentNode;
      if (parent) {
        var textNode = document.createTextNode(span.textContent);
        parent.replaceChild(textNode, span);
      }
    }
  });

  var lines = el.innerText.split('\n');
  var allEmpty = lines.every(function(l){ return l.trim() === ''; });
  if (allEmpty) { el.innerHTML = ''; }

  updNotesButtons();
}

function updNotesButtons() {
  var hasText = getNotesText().trim() !== '';
  var lockBtn  = document.getElementById('btnNotesLock');
  var clearBtn = document.getElementById('btnNotesClear');
  if (lockBtn)  lockBtn.disabled  = !hasText;
  if (clearBtn) clearBtn.disabled = !hasText || notesLocked;
}

function toggleNotesLock() {
  var el = document.getElementById('notesArea');
  var lockBtn = document.getElementById('btnNotesLock');
  notesLocked = !notesLocked;
  el.contentEditable = notesLocked ? 'false' : 'true';
  var iconSvg = notesLocked
    ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><line x1="12" y1="15" x2="12" y2="17"/></svg>'
    : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  lockBtn.innerHTML = iconSvg + '<span>' + (notesLocked ? 'Unlock' : 'Lock') + '</span>';
  lockBtn.title = notesLocked ? 'Unlock notes' : 'Lock notes';
  lockBtn.style.background = notesLocked ? 'rgba(255,255,255,.45)' : '';
  updNotesButtons();
}

function clearNotes() {
  if (notesLocked) return;
  if (!confirm('Clear all notes? This cannot be undone.')) return;
  var el = document.getElementById('notesArea');
  el.innerHTML = '';
  updNotesButtons();
}

// ── METAR TEMPLATE INSERT ─────────────────────────────────────────
// ── METAR / SPECI TEMPLATE INSERT ────────────────────────────────
function ph(s) { return '<span class="metar-placeholder-tag">' + s + '</span>'; }

function buildReportTemplate(type, strUTC) {
  var wdirEl = document.getElementById('v-wdir');
  var wspdEl = document.getElementById('v-wspd');
  var wdir = wdirEl ? wdirEl.textContent.trim() : '';
  var wspd = wspdEl ? wspdEl.textContent.trim() : '';
  var wspdNum = parseInt(wspd) || 0;
  var strWindGRP = wspdNum === 0 ? '00000' : (wdir.padStart(3,'0') + wspd.padStart(2,'0'));

  var tempEl = document.getElementById('v-temp');
  var tempVal = tempEl ? parseFloat(tempEl.textContent) : NaN;
  var strDRY = isNaN(tempVal) ? ph('&lt;T&gt;') : Math.round(tempVal).toString();

  var dpEl = document.getElementById('v-dp');
  var dpVal = dpEl ? parseFloat(dpEl.textContent) : NaN;
  var strDP = isNaN(dpVal) ? ph('&lt;DP&gt;') : Math.round(dpVal).toString();

  var qnhEl = document.getElementById('qnh-result');
  var qnhText = qnhEl ? (qnhEl.innerText || qnhEl.textContent || '') : '';
  var qMatch = qnhText.match(/Q\d{4}/);
  var strQNH = qMatch ? qMatch[0] : ph('&lt;QNH&gt;');

  return type + ' WSAP ' + strUTC + 'Z ' + strWindGRP + 'KT '
    + ph('&lt;CODED VIS&gt;') + ' '
    + ph('&lt;PRESENT WX&gt;') + ' '
    + ph('&lt;CODED CLOUD&gt;') + ' '
    + strDRY + '/' + strDP + ' '
    + strQNH + ' '
    + ph('&lt;RECENT WX&gt;') + ' =';
}

function buildMetarTemplate() {
  var now = new Date();
  var dd = now.getUTCDate(), hh = now.getUTCHours(), min = now.getUTCMinutes();
  if (min > 15) {
    hh += 1;
    if (hh >= 24) { hh = 0; dd += 1; }
    var t = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), dd));
    dd = t.getUTCDate();
  }
  var strUTC = String(dd).padStart(2,'0') + String(hh).padStart(2,'0') + '00';
  return buildReportTemplate('METAR', strUTC);
}

function buildSpeciTemplate() {
  var now = new Date();
  var strUTC = String(now.getUTCDate()).padStart(2,'0')
             + String(now.getUTCHours()).padStart(2,'0')
             + String(now.getUTCMinutes()).padStart(2,'0');
  return buildReportTemplate('SPECI', strUTC);
}

function insertMetarTemplate() { if (!notesLocked) insertTemplate(buildMetarTemplate()); }
function insertSpeciTemplate()  { if (!notesLocked) insertTemplate(buildSpeciTemplate()); }

function insertTemplate(tplHtml) {
  var el = document.getElementById('notesArea');
  var curHtml = el.innerHTML.trim();
  // Always insert at top with a newline after
  el.innerHTML = curHtml !== '' ? tplHtml + '<br>' + curHtml : tplHtml;
  // Move cursor to end of inserted template (after the br)
  var sel = window.getSelection();
  if (sel) {
    var r = document.createRange();
    // Place cursor at start of existing content (after the new line)
    var firstBr = el.querySelector('br');
    if (firstBr && firstBr.nextSibling) {
      r.setStartBefore(firstBr.nextSibling);
    } else {
      r.selectNodeContents(el);
      r.collapse(false);
    }
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);
  }
  el.focus();
  updNotesButtons();
}

// Warn user before page refresh/close if Quick Notes has content
window.addEventListener('beforeunload', function(e) {
  if (getNotesText().trim() !== '') {
    e.preventDefault();
    e.returnValue = '';
  }
});

// ── SCREEN AWAKE (Wake Lock API) ──────────────────────────────────
var wakeLock = null;
var wakeSupported = ('wakeLock' in navigator);

function toggleAwake() {
  var chk = document.getElementById('chkAwake');
  if (chk.checked) {
    if (!wakeSupported) {
      alert('Keep Screen Awake is enabled on supported devices only.\n\nSupported: Chrome 84+, Edge 84+, Android Chrome.\nNot supported: Firefox, Safari (iOS/macOS).\n\nThis device/browser does not support Keep Screen Awake.');
      chk.checked = false;
      setAwakeStatus('no', 'Not supported on this device');
      return;
    }
    requestWakeLock();
  } else {
    releaseWakeLock();
  }
}

function requestWakeLock() {
  navigator.wakeLock.request('screen')
    .then(function(lock) {
      wakeLock = lock;
      setAwakeStatus('on', 'is ON');
      wakeLock.addEventListener('release', function() {
        wakeLock = null;
        if (document.getElementById('chkAwake').checked && !document.hidden) {
          // Tab still visible — device released it (e.g. battery saver), re-acquire
          requestWakeLock();
        } else {
          // Tab hidden or user unchecked — sync checkbox and status to OFF
          document.getElementById('chkAwake').checked = false;
          setAwakeStatus('off', 'is OFF');
        }
      });
    })
    .catch(function(e) {
      wakeLock = null;
      document.getElementById('chkAwake').checked = false;
      setAwakeStatus('no', 'Could not enable: ' + e.message.slice(0, 25));
    });
}

function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
  setAwakeStatus('off', 'is OFF');
}

function setAwakeStatus(cls, msg) {
  var el = document.getElementById('awakeStatus');
  if (!el) return;
  el.className = 'awake-status ' + cls;
  el.textContent = msg;
}

// Re-acquire or sync when tab becomes visible again
document.addEventListener('visibilitychange', function() {
  var chk = document.getElementById('chkAwake');
  if (!document.hidden) {
    if (chk && chk.checked && !wakeLock && wakeSupported) {
      // Checkbox still ticked but lock was dropped while hidden — re-acquire
      requestWakeLock();
    } else if (chk && chk.checked && !wakeSupported) {
      // Should never be checked on unsupported — sync to OFF
      chk.checked = false;
      setAwakeStatus('off', 'is OFF');
    }
  }
});
</script>
