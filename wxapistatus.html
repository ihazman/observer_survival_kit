<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Wx API Status – NEA Realtime APIs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #16a34a;
      --green-light: #dcfce7;
      --yellow:      #ca8a04;
      --yellow-light:#fef9c3;
      --red:         #dc2626;
      --red-light:   #fee2e2;
      --blue:        #2563eb;
      --blue-light:  #dbeafe;
      --gray-50:     #f9fafb;
      --gray-100:    #f3f4f6;
      --gray-200:    #e5e7eb;
      --gray-400:    #9ca3af;
      --gray-500:    #6b7280;
      --gray-600:    #4b5563;
      --gray-700:    #374151;
      --gray-800:    #1f2937;
      --gray-900:    #111827;
      --radius:      8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--gray-50);
      color: var(--gray-900);
      min-height: 100vh;
    }

    /* ─── MAIN ─── */
    .main {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }

    /* ─── OVERALL BANNER ─── */
    .overall-banner {
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 1rem;
    }
    .overall-banner .dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .overall-banner.operational  { background: var(--green-light);  color: var(--green);  }
    .overall-banner.maintenance  { background: var(--blue-light);   color: var(--blue);   }
    .overall-banner.downtime     { background: var(--red-light);    color: var(--red);    }

    .updated-at {
      font-size: .78rem;
      color: var(--gray-500);
      margin-bottom: 24px;
      padding-left: 2px;
    }

    /* ─── SECTION HEADER ─── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .section-title {
      font-size: .78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--gray-500);
    }
    .section-badge {
      font-size: .75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .section-badge.operational { background: var(--green-light);  color: var(--green);  }
    .section-badge.maintenance  { background: var(--blue-light);   color: var(--blue);   }
    .section-badge.downtime     { background: var(--red-light);    color: var(--red);    }

    /* ─── CARD ─── */
    .card {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
    }

    /* ─── COMPONENT ROW ─── */
    .component {
      padding: 14px 18px;
      border-bottom: 1px solid var(--gray-100);
    }
    .component:last-child { border-bottom: none; }

    .component-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .component-name {
      font-size: .92rem;
      font-weight: 500;
      color: var(--gray-800);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }
    .status-dot.operational { background: var(--green);   }
    .status-dot.maintenance  { background: var(--blue);    }
    .status-dot.downtime     { background: var(--red);     }
    .status-dot.not_monitored{ background: var(--gray-400);}

    .component-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .status-label {
      font-size: .78rem;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
    }
    .status-label.operational { background: var(--green-light);  color: var(--green);  }
    .status-label.maintenance  { background: var(--blue-light);   color: var(--blue);   }
    .status-label.downtime     { background: var(--red-light);    color: var(--red);    }
    .status-label.not_monitored{ background: var(--gray-100);     color: var(--gray-500);}

    .chevron {
      width: 16px; height: 16px;
      transition: transform .2s;
      color: var(--gray-400);
      flex-shrink: 0;
    }
    .chevron.open { transform: rotate(180deg); }

    /* ─── HISTORY BARS ─── */
    .history-wrap {
      display: none;
      padding: 10px 0 2px;
    }
    .history-wrap.open { display: block; }

    .history-meta {
      display: flex;
      justify-content: space-between;
      font-size: .72rem;
      color: var(--gray-400);
      margin-bottom: 5px;
    }

    .history-bars {
      display: flex;
      gap: 2px;
      height: 28px;
      align-items: flex-end;
    }
    .bar {
      flex: 1;
      height: 100%;
      border-radius: 2px;
      position: relative;
      cursor: default;
    }
    .bar.operational  { background: #4ade80; }
    .bar.maintenance   { background: #60a5fa; }
    .bar.downtime      { background: #f87171; }
    .bar.no_data       { background: var(--gray-200); }

    .bar-tooltip {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--gray-800);
      color: #fff;
      font-size: .7rem;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s;
      z-index: 10;
    }
    .bar:hover .bar-tooltip { opacity: 1; }

    .uptime-pct {
      font-size: .75rem;
      color: var(--gray-500);
      margin-top: 5px;
    }

    /* ─── LOADING / ERROR ─── */
    .state-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray-500);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--gray-200);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- MAIN CONTENT -->
<div class="main" id="main">
  <div class="state-msg" id="loading">
    <div class="spinner"></div>
    Fetching latest status…
  </div>
</div>

<script>
// ─── Config ──────────────────────────────────────────────────────────────────
const JSON_URL = 'https://status.data.gov.sg/index.json';

// Exactly the 5 APIs we want, in the required order
const WANTED = [
  'Wind Direction Realtime API',
  'Wind Speed Realtime API',
  'Air Temperature Realtime API',
  'Relative Humidity Realtime API',
  'Rainfall Realtime API',
];

// ─── Helpers ─────────────────────────────────────────────────────────────────
const capitalize = s => s ? s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, ' ') : s;

function statusLabel(s) {
  const map = {
    operational:   'Operational',
    maintenance:   'Under Maintenance',
    downtime:      'Disruption',
    not_monitored: 'Not Monitored',
  };
  return map[s] || capitalize(s);
}

function overallState(resources) {
  if (resources.some(r => r.status === 'downtime'))     return 'downtime';
  if (resources.some(r => r.status === 'maintenance'))  return 'maintenance';
  return 'operational';
}

function overallMessage(state) {
  if (state === 'operational')  return 'All systems operational';
  if (state === 'maintenance')  return 'Scheduled maintenance in progress';
  return 'Service disruption detected';
}

function formatUTC(iso) {
  const d = new Date(iso);
  return d.toUTCString().replace('GMT', 'UTC');
}

function formatDay(dateStr) {
  const d = new Date(dateStr + 'T00:00:00Z');
  return d.toLocaleDateString('en-SG', { month:'short', day:'numeric', timeZone:'UTC' });
}

// ─── Format downtime duration into human-readable string ─────────────────────
function formatDuration(seconds) {
  if (!seconds || seconds <= 0) return null;
  const totalMins = Math.round(seconds / 60);
  if (totalMins < 1)   return 'Less than a minute';
  if (totalMins < 60)  return `${totalMins} minute${totalMins !== 1 ? 's' : ''}`;
  const hrs  = Math.floor(totalMins / 60);
  const mins = totalMins % 60;
  let str = `${hrs} hour${hrs !== 1 ? 's' : ''}`;
  if (mins > 0) str += ` ${mins} minute${mins !== 1 ? 's' : ''}`;
  return str;
}

// ─── Build history bar ───────────────────────────────────────────────────────
function buildHistoryBars(history) {
  if (!history || !history.length) return '';

  // Keep only the last 10 days
  const slice = history.slice(-10);

  const bars = slice.map(h => {
    let tip = `${formatDay(h.day)}: ${statusLabel(h.status)}`;
    if (h.status === 'downtime' && h.downtime_duration > 0) {
      tip += ` · Down for ${formatDuration(h.downtime_duration)}`;
    }
    return `<div class="bar ${h.status}" title="${tip}"><span class="bar-tooltip">${tip}</span></div>`;
  }).join('');

  const first = formatDay(slice[0].day);
  const last  = formatDay(slice[slice.length - 1].day);

  return `
    <div class="history-meta">
      <span>${first}</span>
      <span>${last}</span>
    </div>
    <div class="history-bars">${bars}</div>
  `;
}

// ─── Build component HTML ────────────────────────────────────────────────────
function buildComponent(resource) {
  const a   = resource.attributes;
  const id  = `comp-${resource.id}`;
  const pct = a.availability != null ? (a.availability * 100).toFixed(2) + '% uptime' : '';
  const bars = buildHistoryBars(a.status_history);

  return `
    <div class="component">
      <div class="component-top" onclick="toggleHistory('${id}')">
        <div class="component-name">
          <span class="status-dot ${a.status}"></span>
          ${a.public_name}
        </div>
        <div class="component-right">
          <span class="status-label ${a.status}">${statusLabel(a.status)}</span>
          <svg class="chevron" id="chev-${id}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
          </svg>
        </div>
      </div>
      <div class="history-wrap" id="${id}">
        ${bars}
        ${pct ? `<div class="uptime-pct">${pct}</div>` : ''}
      </div>
    </div>
  `;
}

// ─── Toggle expand/collapse ──────────────────────────────────────────────────
function toggleHistory(id) {
  const wrap = document.getElementById(id);
  const chev = document.getElementById('chev-' + id);
  const isOpen = wrap.classList.toggle('open');
  chev.classList.toggle('open', isOpen);
}

// ─── Fetch & Render ──────────────────────────────────────────────────────────
async function loadStatus() {
  const main = document.getElementById('main');

  try {
    const resp = await fetch(JSON_URL + '?_=' + Date.now());
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const json = await resp.json();

    // Extract resources from `included`
    const allResources = (json.included || []).filter(i => i.type === 'status_page_resource');

    // Filter only the 5 wanted APIs, preserving WANTED order
    const wanted = WANTED.map(name =>
      allResources.find(r => r.attributes.public_name === name)
    ).filter(Boolean);

    if (!wanted.length) throw new Error('Target API components not found in JSON');

    const state     = overallState(wanted);
    const updatedAt = json.data?.attributes?.updated_at
                      ? new Date(json.data.attributes.updated_at).toLocaleString('en-SG', { hour12: false })
                      : new Date().toLocaleString('en-SG', { hour12: false });

    const sectionState = state;

    const html = `
      <div class="overall-banner ${state}">
        <span class="dot" style="background:${state==='operational'?'#16a34a':state==='maintenance'?'#2563eb':'#dc2626'}"></span>
        ${overallMessage(state)}
      </div>
      <p class="updated-at">Last updated: ${updatedAt}</p>

      <div class="section-header">
        <span class="section-title">National Environment Agency (NEA) Realtime APIs</span>
        <span class="section-badge ${sectionState}">${statusLabel(sectionState)}</span>
      </div>

      <div class="card">
        ${wanted.map(buildComponent).join('')}
      </div>

    `;

    main.innerHTML = html;

  } catch (err) {
    main.innerHTML = `
      <div class="state-msg">
        <p style="font-size:1.5rem;margin-bottom:8px">⚠️</p>
        <p style="font-weight:600;margin-bottom:4px">Failed to load status data</p>
        <p style="font-size:.82rem;color:#9ca3af">${err.message}</p>
        <p style="font-size:.78rem;margin-top:12px">
          <a href="https://status.data.gov.sg/" target="_blank" rel="noopener">
            Visit status.data.gov.sg directly
          </a>
        </p>
      </div>
    `;
  }
}

loadStatus();
</script>
</body>
</html>
